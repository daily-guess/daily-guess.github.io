<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato – Guess It Daily</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 40px 20px;
      line-height: 1.7;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      padding: 40px 36px;
    }
    h1 { font-size: 26px; color: #f1f5f9; margin-bottom: 8px; }
    p  { color: #94a3b8; margin-bottom: 24px; }
    label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
      font-family: Arial, sans-serif;
    }
    input:focus, textarea:focus { border-color: #3b82f6; }
    textarea { height: 140px; resize: vertical; }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #16a34a; }
    .info { margin-top: 28px; font-size: 13px; color: #475569; }
    .info a { color: #3b82f6; text-decoration: none; }
    .info a:hover { text-decoration: underline; }
    .back { display: inline-block; margin-top: 24px; background: #3b82f6; color: white;
            padding: 10px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; }
    .back:hover { background: #2563eb; }
    .success {
      display: none;
      background: #15803d;
      color: white;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container" style="position:relative;">
    <a href="index.html" style="position:absolute;top:20px;right:24px;background:#334155;color:#94a3b8;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:bold;text-decoration:none;transition:background 0.2s;" onmouseover="this.style.background='#475569';this.style.color='white'" onmouseout="this.style.background='#334155';this.style.color='#94a3b8'">✕ Fechar</a>

    <h1>📬 Contato</h1>
    <p>Tem alguma dúvida, sugestão ou interesse em anunciar no <strong>Guess It Daily</strong>? Mande um email para: <a href="mailto:contato.guessitdaily@gmail.com">contato.guessitdaily@gmail.com</a></p>

    <p>📸 <strong>@guessit_daily</strong></p>

    <a class="back" href="index.html">← Voltar ao Jogo</a>
  </div>

  <script>
    // Mostrar mensagem de sucesso se redirecionado após envio
    if (window.location.search.includes("sent=1")) {
      document.getElementById("success-msg").style.display = "block";
      document.getElementById("contact-form").style.display = "none";
    }
  </script>
</body>
</html>
